[project]
name = "speeddeck"
version = "0.1.0"
description = "SpeedDeck backend — reads NMEA from USB GNSS, streams via WebSocket"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "pynmea2>=1.19",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
